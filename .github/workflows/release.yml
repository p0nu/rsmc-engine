name: release

# Build prebuilt engine binaries and attach them to the GitHub Release when a
# version tag is pushed. Linux builds include a static musl binary that runs on
# any distro with no system dependencies.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to upload release assets

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal Linux: statically linked (musl), runs on any distro with
          # no system dependencies. Covers the overwhelming majority of hosts.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Apple Silicon macOS (every Mac since late 2020). Mainly for running
          # locally to evaluate; production hosting is almost always Linux.
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tooling (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          BIN=rsmc-engine
          DIST="rsmc-engine-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$DIST"
          cp "target/${{ matrix.target }}/release/${BIN}" "$DIST/"
          cp README.md "$DIST/" 2>/dev/null || true
          cp -r migrations "$DIST/" 2>/dev/null || true
          tar -czf "${DIST}.tar.gz" "$DIST"
          echo "ASSET=${DIST}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
