# RSMC production stack: Caddy reverse proxy in front of the engine.
#
# Differences from the dev docker-compose.yml:
#   - A Caddy service terminates TLS, serves the built frontend, and proxies
#     API + WebSocket to the engine. It is the ONLY service that publishes
#     ports to the host.
#   - Postgres, Redis and the engine are NOT published to the host; they are
#     reachable only on the internal Docker network. This is the main security
#     difference from dev, where those ports are exposed for convenience.
#   - The engine serves API only; the built UI (rsmc-ui `npm run build` output)
#     is bind-mounted into Caddy at /srv/www.
#
# Usage (from the rsmc-engine directory):
#   1. Build the UI first:   (in rsmc-ui)  npm run build
#      then point UI_DIST at its dist/ folder (see .env).
#   2. cp .env.example .env  and set JWT_SECRET, POSTGRES_PASSWORD, etc.
#   3. Add a hosts entry:    127.0.0.1  rsmc.localhost
#   4. docker compose -f deploy/docker-compose.prod.yml up --build
#
# Build context is the parent directory (..) so the engine Dockerfile and
# source are in scope when this file lives in deploy/.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Override to your real domain for a real Let's Encrypt certificate.
      SITE_ADDRESS: ${SITE_ADDRESS:-rsmc.localhost}
    # Mount this deploy/ directory (not the single Caddyfile) and point Caddy
    # at the file inside it. Docker Desktop on WSL cannot reliably bind-mount an
    # individual file, only a directory, so this avoids the "not a directory"
    # mount error. Paths are relative to THIS compose file's location (deploy/),
    # so "." is the deploy/ directory itself.
    command: ["caddy", "run", "--config", "/etc/caddy/deploy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - .:/etc/caddy/deploy:ro
      # The built frontend (rsmc-ui/dist). Set UI_DIST in .env to its path.
      - ${UI_DIST:?set UI_DIST in .env to the rsmc-ui dist/ folder}:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsmc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rsmc}
    # No ports published: internal network only.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rsmc} -d ${POSTGRES_DB:-rsmc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # No ports published: internal network only.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # No ports published: only Caddy reaches the engine, on the internal network.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rsmc}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rsmc}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (e.g. openssl rand -hex 32)}
      # Optional: decouple MFA encryption from JWT_SECRET (see .env.example).
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      PORT: "8080"
      APP__DATABASE__AUTO_MIGRATE: "true"
      # Behind the proxy the browser's origin is the proxy's address, so lock
      # CORS to that. For same-origin serving (UI and API both behind Caddy)
      # this can stay tight.
      APP__SERVER__CORS_ORIGINS: ${CORS_ORIGINS:-https://rsmc.localhost}
      APP__STORAGE__BACKUP_DIR: "/app/backups"
      RUST_LOG: ${RUST_LOG:-info,rsmc_engine=debug}
      # Public base URL used in email links: the proxy's externally visible URL.
      APP__EMAIL__PUBLIC_BASE_URL: ${APP__EMAIL__PUBLIC_BASE_URL:-https://rsmc.localhost}
      APP__EMAIL__SMTP_HOST: ${APP__EMAIL__SMTP_HOST:-}
      APP__EMAIL__SMTP_PORT: ${APP__EMAIL__SMTP_PORT:-587}
      APP__EMAIL__SMTP_USERNAME: ${APP__EMAIL__SMTP_USERNAME:-}
      APP__EMAIL__SMTP_PASSWORD: ${APP__EMAIL__SMTP_PASSWORD:-}
      APP__EMAIL__FROM_ADDRESS: ${APP__EMAIL__FROM_ADDRESS:-no-reply@rsmc.local}
      APP__RETENTION__DAYS: ${APP__RETENTION__DAYS:-0}
      APP__GDPR__DELETION_MODE: ${APP__GDPR__DELETION_MODE:-anonymize}
    volumes:
      # Paths are relative to THIS compose file's location (deploy/), so "../"
      # points at the rsmc-engine repo root where the uploads/ and backups/
      # directories live (and must be writable by the container uid, 10001).
      - ${UPLOAD_HOST_DIR:-../uploads}:/app/uploads
      - ${BACKUP_HOST_DIR:-../backups}:/app/backups

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
